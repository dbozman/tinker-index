<header class="site-header">
  <div class="site-header__inner container">
    <a class="site-header__brand" routerLink="/" (click)="closeMenu()">
      <span class="site-header__mark" aria-hidden="true"></span>
      <span class="site-header__name">Tinker Index</span>
    </a>

    <button
      type="button"
      class="site-header__toggle"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="site-nav"
      (click)="toggleMenu()"
    >
      <span class="sr-only">{{ menuOpen() ? 'Close menu' : 'Open menu' }}</span>
      <span class="site-header__toggle-bars" aria-hidden="true"></span>
    </button>

    <nav
      id="site-nav"
      class="site-header__nav"
      [class.site-header__nav--open]="menuOpen()"
      aria-label="Primary"
    >
      <a href="/#featured" (click)="closeMenu()">Discover</a>
      <a href="/#categories" (click)="closeMenu()">Categories</a>
      <a routerLink="/about" routerLinkActive="is-active" (click)="closeMenu()">About</a>
    </nav>
  </div>
</header>
