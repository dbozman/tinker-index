<article class="project-card">
  <div class="project-card__media" [attr.data-category]="project().category.slug" aria-hidden="true">
    <div class="project-card__motif"></div>
  </div>

  <div class="project-card__body">
    <div class="project-card__meta">
      <span class="project-card__category">{{ project().category.name }}</span>
      @if (project().isDemo) {
        <span class="project-card__demo">Demo</span>
      }
    </div>

    <h3 class="project-card__title">{{ project().title }}</h3>
    <p class="project-card__summary">{{ project().summary }}</p>

    <ul class="project-card__chips" aria-label="Project estimates">
      <li>{{ difficultyLabel() }}</li>
      <li>{{ costLabel() }}</li>
      <li>{{ durationLabel() }}</li>
    </ul>
  </div>
</article>
